<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>لیڈز — AI کالنگ ایجنٹ</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
<style>
  body{background:#f0f4f8}.sidebar{width:240px;min-height:100vh;background:#0f2027;position:fixed;top:0;right:0}
  .sidebar .brand{color:#00d4aa;font-size:1.2rem;font-weight:700;padding:20px;border-bottom:1px solid #203a43}
  .sidebar .nav-link{color:#adb5bd;padding:12px 20px;display:flex;align-items:center;gap:10px}
  .sidebar .nav-link:hover,.sidebar .nav-link.active{color:#00d4aa;background:rgba(0,212,170,.1)}
  .main-content{margin-right:240px;padding:24px}
  .card{border:none;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
  .topbar{background:#fff;border-radius:12px;padding:12px 20px;margin-bottom:20px;box-shadow:0 2px 8px rgba(0,0,0,.05);display:flex;justify-content:space-between;align-items:center}
</style>
</head>
<body>
<div class="sidebar">
  <div class="brand">🏠 AI ایجنٹ</div>
  <nav class="mt-2">
    <a href="dashboard.html" class="nav-link"><i class="bi bi-speedometer2"></i> ڈیش بورڈ</a>
    <a href="campaigns.html" class="nav-link"><i class="bi bi-telephone-outbound"></i> کمپینز</a>
    <a href="leads.html" class="nav-link active"><i class="bi bi-people"></i> لیڈز</a>
    <a href="viewings.html" class="nav-link"><i class="bi bi-house-door"></i> ملاقاتیں</a>
    <a href="call-logs.html" class="nav-link"><i class="bi bi-journal-text"></i> کال لاگ</a>
    <hr style="border-color:#203a43">
    <a href="#" class="nav-link" onclick="localStorage.clear();window.location.href='/app/login.html'"><i class="bi bi-box-arrow-left"></i> لاگ آؤٹ</a>
  </nav>
</div>
<div class="main-content">
  <div class="topbar">
    <h5 class="mb-0">🏠 لیڈز — کال کے دوران جمع</h5>
    <button class="btn btn-sm btn-outline-success" onclick="loadData()">🔄 تازہ کریں</button>
  </div>
  <!-- Tabs -->
  <ul class="nav nav-tabs mb-3">
    <li class="nav-item"><button class="nav-link active" onclick="switchTab('leads')">👥 لیڈز</button></li>
    <li class="nav-item"><button class="nav-link" onclick="switchTab('viewings')">🏠 ملاقاتیں</button></li>
    <li class="nav-item"><button class="nav-link" onclick="switchTab('inquiries')">❓ انکوائریز</button></li>
  </ul>

  <div class="card p-3">
    <div id="tableContainer" class="table-responsive">لوڈ ہو رہا ہے...</div>
  </div>
</div>
<script>
const token = localStorage.getItem('token');
if (!token) window.location.href = '/app/login.html';
let currentTab = 'leads';
const api = (url) => fetch(url, {headers:{'Authorization':'Bearer '+token}});

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.nav-tabs .nav-link').forEach((el,i) => {
    el.classList.toggle('active', (i===0&&tab==='leads')||(i===1&&tab==='viewings')||(i===2&&tab==='inquiries'));
  });
  loadData();
}

async function loadData() {
  const r = await api(`/${currentTab}`);
  const list = await r.json();
  const el = document.getElementById('tableContainer');
  if (!list.length) { el.innerHTML = '<p class="text-center text-muted py-4">کوئی ریکارڈ نہیں</p>'; return; }

  if (currentTab === 'leads') {
    el.innerHTML = `<table class="table table-hover"><thead class="table-light"><tr>
      <th>ID</th><th>نام</th><th>فون</th><th>ارادہ</th><th>بجٹ</th><th>علاقہ</th><th>تاریخ</th></tr></thead><tbody>
      ${list.map(r=>`<tr><td><code>${r.id}</code></td><td>${r.customer_name}</td><td dir="ltr">${r.phone_number}</td>
      <td><span class="badge ${r.intent==='buy'?'bg-primary':'bg-warning'}">${r.intent==='buy'?'خریدنا':'کرایہ'}</span></td>
      <td>${r.budget}</td><td>${r.preferred_area}</td><td>${r.created_at?.split('T')[0]}</td></tr>`).join('')}
      </tbody></table>`;
  } else if (currentTab === 'viewings') {
    el.innerHTML = `<table class="table table-hover"><thead class="table-light"><tr>
      <th>ID</th><th>نام</th><th>فون</th><th>جائیداد</th><th>تاریخ</th><th>وقت</th><th>حالت</th></tr></thead><tbody>
      ${list.map(r=>`<tr><td><code>${r.id}</code></td><td>${r.customer_name}</td><td dir="ltr">${r.phone_number}</td>
      <td>${r.property_address}</td><td>${r.viewing_date}</td><td>${r.viewing_time}</td>
      <td><span class="badge bg-success">${r.status}</span></td></tr>`).join('')}
      </tbody></table>`;
  } else {
    el.innerHTML = `<table class="table table-hover"><thead class="table-light"><tr>
      <th>ID</th><th>نام</th><th>فون</th><th>تفصیل</th><th>تاریخ</th></tr></thead><tbody>
      ${list.map(r=>`<tr><td><code>${r.id}</code></td><td>${r.customer_name}</td><td dir="ltr">${r.phone_number}</td>
      <td>${r.inquiry_details}</td><td>${r.created_at?.split('T')[0]}</td></tr>`).join('')}
      </tbody></table>`;
  }
}
loadData();
</script>
</body>
</html>
